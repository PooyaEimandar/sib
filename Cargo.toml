[package]
name = "sib"
version = "0.1.0"
authors = ["mail@pooya.ai"]
description = "A high-performance, secure, and cross-platform modules optimized for efficiency, scalability, and reliability."
documentation = "https://docs.rs/sib"
edition = "2024"
keywords = [
    "sib",
    "networking",
    "real-time",
    "streaming",
    "web",
    "graphics",
    "rendering",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/PooyaEimandar/sib"
categories = ["network-programming", "multimedia", "rendering"]
readme = "README.md"
exclude = [
    ".cargo/config.toml",
    ".github/",
    ".vscode/",
    "bash/",
    "bench/",
    "sib.png",
    "tune.sh",
    "coverage.sh",
    "**/.DS_Store",
]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
arc-swap = { version = "1.9.2", optional = true, default-features = false }
async-trait = { version = "0.1.92", optional = true, default-features = false }
bytemuck = { version = "1.25.2", optional = true, default-features = false, features = [
    "derive",
] }
base64 = { version = "0.23.1", optional = true, default-features = false, features = [
    "std",
] }
boring = { version = "5.2.0", optional = true }
brotli = { version = "9.0.0", optional = true, default-features = false, features = [
    "std",
] }
bytes = { version = "1.12.1", optional = true, default-features = false }
cfg-if = { version = "1.0.5", default-features = false }
crossbeam = { version = "0.8.5", optional = true, default-features = false, features = [
    "std",
] }
dashmap = { version = "6.2.1", optional = true, default-features = false, features = [
    "rayon",
] }
flate2 = { version = "1.1.10", optional = true, default-features = false, features = [
    "rust_backend",
] }
env_logger = { version = "0.11.11", optional = true }
futures-lite = { version = "2.6.1", optional = true, default-features = false, features = [
    "race",
    "std",
] }
glam = { version = "0.34.0", optional = true, default-features = false, features = [
    "std",
] }
glib = { version = "0.22.10", optional = true, default-features = false, features = [
    "gio",
] }
governor = { version = "0.10.4", optional = true }
gstreamer = { version = "0.25.4", optional = true }
gstreamer-app = { version = "0.25.2", optional = true }
gstreamer-video = { version = "0.25.4", optional = true }
glyphon = { version = "0.12.0", optional = true }
h2 = { version = "0.4.19", optional = true, default-features = false }
heapless = { version = "0.9.3", optional = true, default-features = false }
hex = { version = "0.4.3", optional = true }
http = { version = "1.5.0", optional = true, default-features = false, features = [
    "std",
] }
hmac = { version = "0.13.0", optional = true, default-features = false }
httparse = { version = "1.10.1", optional = true, default-features = false }
httpdate = { version = "1.0.3", optional = true, default-features = false }
http-body-util = { version = "0.1.5", optional = true }
itoa = { version = "1.0.18", default-features = false, optional = true }
may = { version = "0.3.51", optional = true }
mime = { version = "0.3.17", optional = true }
mime_guess = { version = "2.0.5", optional = true }
memmap2 = { version = "0.9.11", optional = true, default-features = false }
once_cell = { version = "1.21.4", optional = true, default-features = false, features = [
    "std",
] }
pollster = { version = "1.0.1", optional = true }
rand = { version = "0.10.3", optional = true }
rcgen = { version = "0.14.10", optional = true }
rtc = { version = "0.21.0", optional = true, default-features = false }
rdkafka = { version = "0.39.0", optional = true, features = [
    "cmake-build",
    "ssl",
] }
rustls = { version = "0.23.45", optional = true, default-features = false, features = [
    "aws_lc_rs",
    "prefer-post-quantum",
    "std",
    "tls12",
] }
rustls-pki-types = { version = "1.15.1", optional = true, default-features = false }
serde = { version = "1.0.229", optional = true, default-features = false, features = [
    "std",
] }
serde_json = { version = "1.0.151", optional = true, default-features = false, features = [
    "std",
] }
sha1 = { version = "0.11.0", optional = true, default-features = false }
sha2 = { version = "0.11.0", optional = true }
socket2 = { version = "0.6.5", optional = true, default-features = false, features = [
    "all",
] }
tracing = { version = "0.1.44", default-features = false, features = [
    "attributes",
    "std",
] }
# The newest skrifa that swash (glyphon -> cosmic-text) accepts. A newer one
# would ship a second copy of the font parser in every wasm build.
skrifa = { version = "0.44.0", optional = true, default-features = false, features = [
    "std",
] }
tokio = { version = "1.53.2", optional = true, default-features = false, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-rustls = { version = "0.26.6", optional = true, default-features = false, features = [
    "aws-lc-rs",
    "tls12",
] }
tokio-util = { version = "0.7.19", optional = true, default-features = false }
webrtc = { version = "0.21.0", optional = true }
web-time = { version = "1.1.0", optional = true }
wgpu = { version = "30.0.1", optional = true }
winit = { version = "0.30.13", optional = true }
wtransport = { version = "0.7.2", optional = true, default-features = false, features = [
    "ring",
] }
zstd = { version = "0.14.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1.7", optional = true }
wasm-bindgen-futures = { version = "0.4.79", optional = true }
web-sys = { version = "0.3.106", optional = true, features = [
    "VisualViewport",
    "Window",
] }

# unix (non-android/ios) only deps
[target.'cfg(all(unix, not(target_os = "android"), not(target_os = "ios")))'.dependencies]
foundationdb-sys = { version = "0.11.0", optional = true, default-features = false, features = [
    "fdb-7_3",
] }

# linux-only deps
[target.'cfg(target_os = "linux")'.dependencies]
futures-rustls = { version = "0.26.0", optional = true, default-features = false, features = [
    "aws-lc-rs",
    "tls12",
] }
glommio = { version = "0.9.0", optional = true, default-features = false }
h3 = { version = "0.0.8", optional = true, default-features = false }
h3-quinn = { version = "0.0.10", optional = true, default-features = false }
quinn = { version = "0.11.12", optional = true, default-features = false, features = [
    "runtime-async-std",
    "rustls",
] }


[features]
default = []
db-fdb = ["foundationdb-sys", "crossbeam"]
mtls = ["rcgen", "rustls"]
net-file-server = [
    "brotli",
    "dashmap",
    "flate2",
    "httpdate",
    "memmap2",
    "mime_guess",
    "mime",
    "zstd",
]
net-kafka-cli = ["futures-lite", "rdkafka", "tokio-util"]
net-h1-server = [
    "arc-swap",
    "async-trait",
    "boring",
    "bytes",
    "dashmap",
    "heapless",
    "http",
    "httparse",
    "may",
    "mtls",
    "once_cell",
    "socket2",
]
net-h2-server = [
    "async-trait",
    "bytes",
    "dashmap",
    "futures-lite",
    "h2",
    "heapless",
    "http-body-util",
    "http",
    "httparse",
    "itoa",
    "mtls",
    "rustls-pki-types",
    "socket2",
    "tokio-util",
]
net-h3-server = [
    "async-trait",
    "bytes",
    "dashmap",
    "futures-lite",
    "h3-quinn",
    "h3",
    "http",
    "quinn",
    "rustls-pki-types",
    "mtls",
    "socket2",
    "tokio",
]
net-ratelimiter = ["governor", "hmac", "sha2", "base64", "rand", "hex"]
net-ws-server = ["base64", "sha1"]
net-wt-server = [
    "async-trait",
    "bytes",
    "dashmap",
    "rustls-pki-types",
    "tokio",
    "wtransport",
]

rt-glommio = ["futures-rustls", "glommio", "tokio"]
rt-tokio = ["tokio", "tokio-rustls"]
rt-may = ["may"]
render = [
    "bytemuck",
    "console_error_panic_hook",
    "env_logger",
    "glam",
    "glyphon",
    "pollster",
    "skrifa",
    "web-time",
    "wasm-bindgen-futures",
    "web-sys",
    "wgpu",
    "winit",
]

stm-udp-sender = ["crossbeam", "glib", "gstreamer", "gstreamer-video"]
stm-udp-receiver = ["glib", "gstreamer", "gstreamer-app", "gstreamer-video"]
stm-webrtc-sender = [
    "async-trait",
    "bytes",
    "futures-lite",
    "glib",
    "gstreamer-app",
    "gstreamer-video",
    "gstreamer",
    "net-h2-server",
    "net-ws-server",
    "rand",
    "rt-tokio",
    "rtc",
    "serde_json",
    "serde",
    "tokio-util",
    "tokio",
    "webrtc",
]

[dev-dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
dashmap = { version = "6.2.1", default-features = false, features = ["rayon"] }
http = { version = "1.5.0", default-features = false, features = ["std"] }
nonzero_ext = { version = "0.3.0", default-features = false, features = [
    "std",
] }
num_cpus = { version = "1.17.0" }
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "http2",
    "http3",
] }
sha2 = { version = "0.11.0" }
tungstenite = { version = "0.30.0" }
native-tls = "0.2.18"
tokio = { version = "1.53.2", default-features = false, features = [
    "macros",
    "rt",
] }

[build-dependencies]
chrono = { version = "0.4.45" }
