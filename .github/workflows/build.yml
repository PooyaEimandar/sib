name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --cfg reqwest_unstable -D warnings
  NETWORK_FEATURES: rt-tokio,net-h1-server,net-h2-server,net-file-server,net-ws-server,net-wt-server

jobs:
  linux:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build nasm \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross \
            pkg-config libssl-dev

      - name: Install GStreamer (host)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            libges-1.0-dev \
            libgstreamer-plugins-bad1.0-dev

      - name: Run FoundationDB setup
        run: |
          bash ./bash/fdb.sh
          echo "SIB_FDB_CLUSTER_FILE=/etc/foundationdb/fdb.cluster" >> $GITHUB_ENV

      - name: Setup Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}

      # Cargo.lock is not committed for this library. Resolve dependencies once
      # so subsequent --locked commands use the same versions in this job.
      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Configure AArch64 cross toolchain env
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> $GITHUB_ENV
          echo "RANLIB_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ranlib" >> $GITHUB_ENV

          # Pick the cross compiler:
          echo "CMAKE_C_COMPILER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER=aarch64-linux-gnu-g++" >> $GITHUB_ENV

          # Be explicit for Cargo's linker
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Configure Cargo linker (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          ar = "aarch64-linux-gnu-ar"
          EOF

      - name: Clean
        run: cargo clean

      - name: Run Clippy
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          rustup component add clippy
          # Lint each runtime so lints in runtime-gated code (may/glommio) can't drift.
          cargo clippy --locked --all-targets --no-default-features --features "$NETWORK_FEATURES,db-fdb" -- -D warnings
          cargo clippy --all-targets --no-default-features --features "rt-may net-h1-server db-fdb" -- -D warnings
          cargo clippy --all-targets --no-default-features --features "rt-glommio net-h2-server db-fdb" -- -D warnings

      - name: Build
        run: cargo build --locked --release --target=${{ matrix.target }} --no-default-features --features "$NETWORK_FEATURES"

      - name: Check render module (native + wasm)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo check --no-default-features --features render
          rustup target add wasm32-unknown-unknown
          cargo check --target wasm32-unknown-unknown --no-default-features --features render

      - name: Test (tokio runtime + FDB)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked --release --no-default-features --features "$NETWORK_FEATURES,db-fdb"

      # Exercise the FDB layer on the other two runtimes against the same live cluster.
      # The async cache/futures path is shared by tokio + glommio; `may` uses the
      # blocking path. Run once on the host (x86_64); the aarch64 matrix entry
      # cross-compiles and cannot run these.
      - name: Test (may runtime + FDB)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --release --no-default-features --features "rt-may db-fdb"

      - name: Test (glommio runtime + FDB)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --release --no-default-features --features "rt-glommio db-fdb"

  windows:
    name: Windows x86_64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install ninja nasm llvm -y
          "$env:ProgramFiles\NASM" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_ENV

      - name: Setup Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --no-default-features --features "$env:NETWORK_FEATURES" -- -D warnings

      - name: Build
        run: cargo build --locked --release --no-default-features --features "$env:NETWORK_FEATURES"

      - name: Test
        run: cargo test --locked --release --no-default-features --features "$env:NETWORK_FEATURES"

  android:
    name: Android ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          [armv7-linux-androideabi, aarch64-linux-android, x86_64-linux-android]

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build nasm

      - name: Setup Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Install NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build
        run: cargo ndk -t ${{ matrix.target }} -o ./target build --locked --release --no-default-features --features "$NETWORK_FEATURES"

  apple:
    name: Apple (macOS & iOS)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ninja nasm

      - name: Run FoundationDB setup
        run: |
          bash ./bash/fdb.sh
          echo "SIB_FDB_CLUSTER_FILE=/usr/local/etc/foundationdb/fdb.cluster" >> $GITHUB_ENV

      - name: Setup Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustup target add aarch64-apple-darwin
          rustup target add aarch64-apple-ios

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --no-default-features --features "$NETWORK_FEATURES,db-fdb" -- -D warnings

      - name: Build for macOS (arm64)
        run: cargo build --locked --release --target=aarch64-apple-darwin --no-default-features --features "$NETWORK_FEATURES"

      - name: Test (macOS)
        run: cargo test --locked --release --no-default-features --features "$NETWORK_FEATURES"

      - name: Build for iOS (staticlib)
        env:
          # net-h1-server's may/nix socket bindings do not compile on iOS.
          IOS_NETWORK_FEATURES: rt-tokio,net-h2-server,net-file-server,net-ws-server,net-wt-server
        run: |
          cargo install cargo-lipo
          cargo lipo --locked --release --targets=aarch64-apple-ios --no-default-features --features "$IOS_NETWORK_FEATURES"
